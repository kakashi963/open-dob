<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPEN DOB - State Registry Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FDFBF7;
            --ink: #1E293B;
            --ink-faded: #475569;
            --accent: #065F46;
            --stamp-red: #991B1B;
            --ledger-line: #E2E8F0;
            --paper-texture: url('https://www.transparenttextures.com/patterns/felt.png');
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #E5E7EB; 
            background-image: var(--paper-texture);
            color: var(--ink); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
        }

        .container { 
            max-width: 900px; 
            margin: 60px auto; 
            padding: 60px; 
            background-color: var(--paper);
            box-shadow: 0 0 40px rgba(0,0,0,0.1), 0 0 2px rgba(0,0,0,0.1);
            position: relative;
            min-height: 100vh;
        }

        .container::before {
            content: "DECLASSIFIED";
            position: absolute;
            top: 40px;
            right: 40px;
            border: 3px solid var(--stamp-red);
            color: var(--stamp-red);
            padding: 4px 12px;
            font-weight: 900;
            font-size: 14px;
            transform: rotate(15deg);
            opacity: 0.6;
            pointer-events: none;
        }

        header { text-align: left; border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 48px; }
        header h1 { 
            font-family: 'EB Garamond', serif; 
            font-size: 42px; 
            font-weight: 700; 
            margin: 0; 
            letter-spacing: -0.01em; 
            text-transform: uppercase;
        }
        header p { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faded); margin: 8px 0 0; }

        .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 32px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; position: relative; }
        
        /* Ensure the school search group is above the name filter on mobile */
        #schoolSearchGroup { z-index: 100; }
        #nameFilterGroup { z-index: 10; }
        .input-group label { 
            font-family: 'EB Garamond', serif; 
            font-size: 16px; 
            font-weight: 600; 
            color: var(--ink);
            font-style: italic;
        }
        
        input { 
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--ink-faded);
            padding: 8px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            outline: none;
            color: var(--ink);
            width: 100%;
        }
        input:focus { border-bottom: 2px solid var(--ink); }

        .autocomplete-results {
            position: absolute; top: 100%; left: 0; right: 0; background: var(--paper); border: 1px solid var(--ink);
            max-height: 250px; overflow-y: auto; z-index: 10000; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); display: none; margin-top: 4px;
        }
        .autocomplete-item { padding: 12px 16px; cursor: pointer; font-size: 13px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid var(--ledger-line); }
        .autocomplete-item:hover { background-color: var(--ink); color: var(--paper); }

        .btn-search { 
            background: var(--ink); 
            color: var(--paper); 
            border: none; 
            padding: 16px 32px; 
            font-family: 'EB Garamond', serif;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-search:hover { background: var(--ink-faded); letter-spacing: 1px; }

        .results-header { 
            font-family: 'EB Garamond', serif; 
            font-size: 20px; 
            font-weight: 700; 
            border-bottom: 1px solid var(--ink); 
            padding-bottom: 8px;
            margin: 64px 0 24px;
            display: none; 
            font-style: italic;
        }
        .student-card { 
            border-bottom: 1px solid var(--ledger-line);
            padding: 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .student-info h3 { margin: 0; font-family: 'EB Garamond', serif; font-size: 18px; font-weight: 600; }
        .student-info p { margin: 4px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faded); }
        .btn-strike { background: transparent; color: var(--ink); border: 1px solid var(--ink); padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-strike:hover { background: var(--ink); color: var(--paper); }

        /* The Dossier Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { 
            background: var(--paper); 
            background-image: var(--paper-texture);
            width: 90%; max-width: 600px; border-radius: 2px; padding: 40px; box-shadow: 20px 20px 0px rgba(0,0,0,0.3); border: 1px solid var(--ink);
            position: relative;
        }

        /* Dossier Card Style */
        .dossier-card {
            border: 2px solid var(--ink);
            padding: 40px;
            position: relative;
            background: white;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.02);
        }
        
        .dossier-id { 
            position: absolute; top: 10px; right: 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-faded);
        }

        .dossier-header { 
            text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--ink); padding-bottom: 20px;
        }
        .dossier-header h2 { margin: 0; font-family: 'EB Garamond', serif; font-size: 32px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; }
        .dossier-header p { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faded); margin-top: 5px; }

        /* Data Layout */
        .dossier-row { margin-bottom: 24px; border-bottom: 1px dotted var(--ledger-line); padding-bottom: 8px; }
        .dossier-row label { display: block; font-family: 'EB Garamond', serif; font-size: 14px; font-weight: 700; color: var(--ink-faded); font-style: italic; margin-bottom: 4px; }
        .dossier-row span { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--ink); font-weight: 700; text-transform: uppercase; }
        
        .dossier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .dob-box { 
            border: 2px solid var(--stamp-red); padding: 10px 20px; display: inline-block; transform: rotate(-1deg); margin-top: 10px;
        }
        .dob-box label { color: var(--stamp-red); font-style: normal; margin-bottom: 2px; }
        .dob-box span { color: var(--stamp-red); font-size: 24px; }

        .status-stamp { 
            position: absolute; bottom: 40px; right: 40px; border: 4px double var(--accent); color: var(--accent);
            padding: 8px 24px; font-weight: 900; font-family: 'Inter', sans-serif; text-transform: uppercase;
            transform: rotate(-12deg); font-size: 16px; opacity: 0.8; letter-spacing: 1px;
        }

        .close-btn { 
            margin-top: 30px; width: 100%; height: 52px; background: transparent; border: 2px solid var(--ink); 
            font-family: 'EB Garamond', serif; font-weight: 700; font-size: 16px; color: var(--ink); cursor: pointer; display: none; 
            text-transform: uppercase;
        }
        .close-btn:hover { background: var(--ink); color: var(--paper); }

        /* Progress Forge */
        .progress-container { width: 100%; height: 4px; background: var(--ledger-line); margin-bottom: 24px; }
        .progress-bar { height: 100%; width: 0%; background: var(--ink); transition: width 0.4s ease-out; }
        .status-ticker { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--ink); text-transform: uppercase; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container { 
                margin: 10px; 
                padding: 30px 20px; 
                min-height: calc(100vh - 20px);
            }
            .container::before {
                top: 20px;
                right: 20px;
                font-size: 12px;
            }
            header h1 { font-size: 32px; }
            .search-grid { grid-template-columns: 1fr; gap: 20px; }
            .btn-search { width: 100%; }
            .modal-content { padding: 20px; }
            .dossier-card { padding: 20px; }
            .dossier-header h2 { font-size: 24px; }
            .dossier-grid { grid-template-columns: 1fr; gap: 10px; }
            .dossier-row span { font-size: 16px; }
            .dob-box span { font-size: 20px; }
            .status-stamp { bottom: 20px; right: 20px; font-size: 14px; padding: 6px 16px; }
            .student-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .btn-strike {
                width: 100%;
                text-align: center;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>OPEN DOB</h1>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--stamp-red); margin-top: -5px; margin-bottom: 10px; letter-spacing: 2px;">SSLC FILES</div>
        <p>WE FIGHT. WE FETCH. WE EXPOSE. // BY KAKSHI</p>
    </header>

    <div class="search-card">
        <div class="search-grid">
            <div class="input-group" id="schoolSearchGroup">
                <label>INSTITUTION NAME</label>
                <input type="text" id="schoolNameInput" oninput="filterSchools()" placeholder="Enter School Name..." autocomplete="off">
                <div id="schoolDropdown" class="autocomplete-results"></div>
                <input type="hidden" id="selectedScode">
            </div>
            <div class="input-group" id="nameFilterGroup">
                <label>CANDIDATE FILTER</label>
                <input type="text" id="nameInput" oninput="renderResults()" placeholder="Filter by Name...">
            </div>
        </div>
        <button class="btn-search" id="searchBtn" onclick="searchStudents()">Retrieve Registry</button>
    </div>

    <div class="results-header" id="resultsCount">Registry Records</div>
    <div id="resultsList"></div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <div id="forgeUI">
            <div class="dossier-header">
                <h2>Accessing Archive</h2>
                <p>RECOVERING CANDIDATE METADATA...</p>
            </div>
            <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
            <div id="statusTicker" class="status-ticker">Waking up parallel worker threads...</div>
            <div style="margin-top: 32px; font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px; color: var(--ink-faded); text-align: center;">
                "The preservation of state records is essential for the collective memory of the republic."
            </div>
        </div>
        <div id="profileUI" style="display: none;"></div>
        <button id="modalClose" class="close-btn" onclick="closeModal()">Close Dossier</button>
    </div>
</div>

<script>
    let allSchools = [];
    let allStudents = [];

    window.onload = async () => {
        try {
            const res = await fetch('/get_schools');
            allSchools = await res.json();
            console.log(`[*] ${allSchools.length} institutions loaded.`);
        } catch (e) { console.error(e); }
    };

    function filterSchools() {
        const val = document.getElementById('schoolNameInput').value.toUpperCase();
        const dropdown = document.getElementById('schoolDropdown');
        dropdown.innerHTML = "";
        if (val.length < 2) { dropdown.style.display = 'none'; return; }
        const filtered = allSchools.filter(s => s.name.toUpperCase().includes(val)).slice(0, 15);
        if (filtered.length > 0) {
            filtered.forEach(s => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.innerText = `${s.code} | ${s.name}`;
                item.onclick = () => {
                    document.getElementById('schoolNameInput').value = s.name;
                    document.getElementById('selectedScode').value = s.code;
                    dropdown.style.display = 'none';
                };
                dropdown.appendChild(item);
            });
            dropdown.style.display = 'block';
        } else { dropdown.style.display = 'none'; }
    }

    async function searchStudents() {
        const scode = document.getElementById('selectedScode').value;
        const btn = document.getElementById('searchBtn');
        if (!scode) return alert("Select an institution first!");
        btn.disabled = true; 
        btn.innerText = "QUERYING STATE SERVERS... (usually 15-40 seconds)";
        try {
            const res = await fetch('/search', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({scode}) });
            const data = await res.json();
            if (data.success) { allStudents = data.students; renderResults(); }
            else { alert("Archive Access Failed: " + data.error); }
        } catch (e) { alert("Registry Connection Lost."); }
        finally { btn.disabled = false; btn.innerText = "Retrieve Registry"; }
    }

    function renderResults() {
        const filter = document.getElementById('nameInput').value.toUpperCase();
        const list = document.getElementById('resultsList');
        const header = document.getElementById('resultsCount');
        list.innerHTML = "";
        const filtered = allStudents.filter(s => s.name.toUpperCase().includes(filter));
        header.innerText = `${filtered.length} RECORDS RECOVERED`;
        header.style.display = 'block';
        filtered.forEach(s => {
            const card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `<div class="student-info"><h3>${s.name}</h3><p>ID_REF: ${s.regno}</p></div><button class="btn-strike" onclick="strikeProfile('${s.regno}', '${s.name}')">FETCH DOB</button>`;
            list.appendChild(card);
        });
    }

    async function strikeProfile(regno, name) {
        const modal = document.getElementById('profileModal');
        const forge = document.getElementById('forgeUI');
        const profile = document.getElementById('profileUI');
        const bar = document.getElementById('progressBar');
        const ticker = document.getElementById('statusTicker');
        const close = document.getElementById('modalClose');

        modal.style.display = 'flex';
        profile.style.display = 'none';
        forge.style.display = 'block';
        close.style.display = 'none';
        bar.style.width = '0%';
        ticker.innerText = "Initializing 200 worker threads...";

        let prog = 0;
        const interval = setInterval(() => {
            if (prog < 90) {
                prog += Math.random() * 15;
                bar.style.width = `${Math.min(prog, 92)}%`;
                if (prog > 15) ticker.innerText = "SCANNING REGISTRY DATABASE...";
                if (prog > 70) ticker.innerText = "FINALIZING DOSSIER ASSEMBLY...";
            }
        }, 700);

        try {
            const start = Date.now();
            const res = await fetch('/strike', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({regno}) });
            const result = await res.json();
            clearInterval(interval);
            const duration = ((Date.now() - start)/1000).toFixed(2);

            if (result.success) {
                const d = result.data;
                bar.style.width = '100%';
                ticker.innerText = `RECORD RECOVERED IN ${duration}S`;
                setTimeout(() => {
                    forge.style.display = 'none';
                    profile.style.display = 'block';
                    close.style.display = 'block';
                    profile.innerHTML = `
                        <div class="dossier-card">
                            <div class="dossier-id">REF_NO: TVM/${d.regnum}</div>
                            <div class="dossier-header">
                                <h2>CANDIDATE DOSSIER</h2>
                                <p>OFFICE OF THE COMMISSIONER FOR GOVERNMENT EXAMINATIONS</p>
                            </div>
                            <div class="dossier-row">
                                <label>SUBJECT NAME</label>
                                <span>${d.Names}</span>
                            </div>
                            <div class="dossier-grid">
                                <div class="dossier-row">
                                    <label>REGISTER REF</label>
                                    <span>${d.regnum}</span>
                                </div>
                                <div class="dossier-row">
                                    <label>GENDER</label>
                                    <span>${d.Sex || 'N/A'}</span>
                                </div>
                            </div>
                            <div class="dossier-row">
                                <label>INSTITUTION</label>
                                <span>${d.School}</span>
                            </div>
                            <div class="dob-box">
                                <label>DATE OF BIRTH</label>
                                <span>${d.dob}</span>
                            </div>
                        </div>
                    `;
                }, 600);
            } else {
                ticker.innerText = "RECOVERY FAILED: NO RECORD FOUND";
                bar.style.background = "#EF4444";
                close.style.display = 'block';
            }
        } catch (e) {
            ticker.innerText = "ERROR: BACKEND ARCHIVE UNREACHABLE";
            clearInterval(interval);
            close.style.display = 'block';
        }
    }
    function closeModal() { document.getElementById('profileModal').style.display = 'none'; }
</script>
</body>
</html>
